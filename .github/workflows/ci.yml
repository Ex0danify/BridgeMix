name: CI

# The required check is `ci-pass`. It gathers the lint job and the test matrix, so branch protection needs one entry that
# survives changes to the Python versions below.
on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Versions with prebuilt python-rtmidi / PyQt6 wheels (see setup.sh).
        python-version: ["3.11", "3.12"]
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      # The floor is the current level, to stop it eroding. Raise it as the GUI gets tests.
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen   # no display server on the runner
        run: pytest -q --cov=bridgemix --cov-report=term-missing --cov-report=xml --cov-fail-under=35
      - name: Coverage on the run summary
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        run: |
          {
            echo '### Coverage (Python 3.12)'
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

  # Freezes and smoke-tests the app, then builds the installer, so a packaging break shows up at PR time rather than at release.
  windows-build:
    uses: ./.github/workflows/build-windows.yml

  # Freezes and smoke-tests the app on macOS and builds the dmg. It cannot be tried by hand without a Mac, so it is checked here.
  macos-build:
    uses: ./.github/workflows/build-macos.yml

  # Builds the Flatpak and runs the app once inside its sandbox, so a packaging break shows up at PR time rather than at release.
  flatpak-build:
    uses: ./.github/workflows/build-flatpak.yml

  # The one status to require in the branch protection.
  ci-pass:
    if: always()
    needs: [lint, test, windows-build, macos-build, flatpak-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ join(needs.*.result, ' ') }}' | grep -qE 'failure|cancelled'; then exit 1; fi
