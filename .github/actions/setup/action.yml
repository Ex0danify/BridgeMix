name: Set up BridgeMix
description: Python, Qt runtime libraries and the package with dev extras
inputs:
  python-version:
    description: Python version
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    # PyQt6 dlopens these even under the offscreen platform plugin.
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0
    - shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
